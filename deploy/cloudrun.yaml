# ---------------------------------------------------------------------------
# Cloud Scheduler Setup Commands (Free Tier: up to 3 jobs/month per account)
# ---------------------------------------------------------------------------
# 1) IMAP Order Email Sync every 10 minutes:
# gcloud scheduler jobs create http sololedger-email-sync \
#   --location=asia-northeast3 \
#   --schedule="*/10 * * * *" \
#   --uri="https://REPLACE_WITH_SERVICE_URL/api/v1/cloud/jobs/email-sync" \
#   --http-method=POST \
#   --headers="Content-Type=application/json,X-CloudScheduler-Secret=REPLACE_WITH_SCHEDULER_SECRET" \
#   --message-body='{"lookback_days":14,"max_messages":200,"backup_after_sync":true}'
#
# 2) Daily SQLite Hot Snapshot & Archive Verification (03:00 KST):
# gcloud scheduler jobs create http sololedger-snapshot-backup \
#   --location=asia-northeast3 \
#   --schedule="0 3 * * *" \
#   --time-zone="Asia/Seoul" \
#   --uri="https://REPLACE_WITH_SERVICE_URL/api/v1/cloud/jobs/snapshot-backup" \
#   --http-method=POST \
#   --headers="Content-Type=application/json,X-CloudScheduler-Secret=REPLACE_WITH_SCHEDULER_SECRET" \
#   --message-body='{"verify_archive_keys":true}'
