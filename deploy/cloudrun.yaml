# Google Cloud Run Service Manifest for SoloLedger (Phase 9 Hybrid Hub)
# - Enforces maxScale=1 so SQLite runs safely on container local /tmp disk without GCS FUSE lock conflicts.
# - Syncs receipts, exports, and SQLite snapshots to Google Cloud Storage.
apiVersion: serving.knative.dev/v1
kind: Service
metadata:
  name: sololedger-api
  labels:
    app: sololedger-api
    cloud.googleapis.com/location: asia-northeast3
spec:
  template:
    metadata:
      annotations:
        autoscaling.knative.dev/minScale: "0"
        autoscaling.knative.dev/maxScale: "1"
        run.googleapis.com/startup-cpu-boost: "true"
    spec:
      containerConcurrency: 20
      timeoutSeconds: 300
      containers:
        - name: sololedger-api
          image: asia-northeast3-docker.pkg.dev/PROJECT_ID/sololedger/sololedger-api:v1.4.0
          ports:
            - containerPort: 8000
          resources:
            limits:
              cpu: "1"
              memory: 512Mi
          env:
            - name: SOLOLEDGER_ENV
              value: production
            - name: SOLOLEDGER_CLOUD_MODE
              value: "true"
            - name: SOLOLEDGER_STORAGE_BACKEND
              value: gcs
            - name: SOLOLEDGER_GCS_BUCKET
              value: REPLACE_WITH_SOLOLEDGER_BUCKET
            - name: SOLOLEDGER_GCS_PREFIX
              value: sololedger
            - name: SOLOLEDGER_DB_PATH
              value: /tmp/sololedger_prod.db
            - name: SOLOLEDGER_ARCHIVE_DIR
              value: /tmp/archive
            - name: SOLOLEDGER_API_KEY
              valueFrom:
                secretKeyRef:
                  name: sololedger-api-key
                  key: latest
            - name: SOLOLEDGER_ADMIN_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: sololedger-admin-password
                  key: latest
            - name: SOLOLEDGER_SCHEDULER_SECRET
              valueFrom:
                secretKeyRef:
                  name: sololedger-scheduler-secret
                  key: latest
            - name: TELEGRAM_BOT_TOKEN
              valueFrom:
                secretKeyRef:
                  name: sololedger-telegram-bot-token
                  key: latest
            - name: NTS_API_SERVICE_KEY
              valueFrom:
                secretKeyRef:
                  name: sololedger-nts-api-key
                  key: latest
            - name: GEMINI_API_KEY
              valueFrom:
                secretKeyRef:
                  name: sololedger-gemini-api-key
                  key: latest
          startupProbe:
            httpGet:
              path: /health
              port: 8000
            initialDelaySeconds: 2
            periodSeconds: 5
            failureThreshold: 6
          livenessProbe:
            httpGet:
              path: /health
              port: 8000
            periodSeconds: 30

# ---------------------------------------------------------------------------
